services:
  - type: web
    name: cers-dispatch
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CERS_OFFICER_TOKEN
        generateValue: true
      - key: CERS_COOKIE_SECURE
        value: "1"
